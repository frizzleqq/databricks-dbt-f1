name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: checks (ruff, sqlfluff, dbt)
    runs-on: ubuntu-latest
    env:
      # dbt_profiles/profiles.yml renders these via env_var() while building the
      # profile, even for offline commands like `dbt deps`/`dbt parse` below.
      # The values are never used to open a real connection for these commands;
      # only the final `dbt test` step connects, with real step-level values.
      DBT_HOST: unused
      DBT_ACCESS_TOKEN: unused
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies
        id: install
        run: uv sync --locked

      # The checks below do not depend on each other, so each one runs even if an
      # earlier one failed. A single run then reports every problem at once
      # instead of stopping at the first.
      - name: ruff check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check --output-format github

      - name: ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check --diff

      - name: sqlfluff lint
        # Uses the jinja templater, so no dbt profile/warehouse is needed.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run sqlfluff lint src --format github-annotation-native

      - name: dbt deps
        id: dbt-deps
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run dbt deps

      - name: dbt parse (validates project, models, refs, and YAML schemas)
        id: dbt-parse
        if: ${{ !cancelled() && steps.dbt-deps.outcome == 'success' }}
        run: uv run dbt parse --profiles-dir dbt_profiles --target dev

      - name: dbt test (macro singular tests on a SQL warehouse)
        # The singular tests run SELECTs over literal values through the CI
        # service principal: they need Databricks compute but neither read
        # nor create any tables/schemas.
        if: ${{ !cancelled() && steps.dbt-parse.outcome == 'success' }}
        env:
          DBT_HOST: ${{ secrets.DATABRICKS_HOST }}
          DBT_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DBT_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: uv run dbt test --select "test_type:singular" --profiles-dir dbt_profiles --target ci

  bundle-validate:
    name: databricks bundle validate
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_BUNDLE_ENV: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
        with:
          version: 1.11.0

      - name: Check Databricks CLI
        run: databricks current-user me

      - name: Validate Databricks Bundle
        run: databricks bundle validate