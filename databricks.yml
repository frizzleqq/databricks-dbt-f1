# This file defines the structure of this project and how it is deployed
# to production using Declarative Automation Bundles.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_dbt_f1
  uuid: d2077e9f-28e8-49f7-a64c-03357e281fe2

include:
  - resources/*.yml

# The bronze/silver/gold schemas are shared, fixed names that dbt models and
# the ingestion job reference literally (see src/models/*/,
# src/ingestion/land_f1db.py) -- they are not per-developer sandboxes, so
# skip the "[dev <user>]"-style prefix that `mode: development` would
# otherwise apply to the UC schema resources in resources/*.schema.yml.
experimental:
  skip_name_prefix_for_schema: true

# Deployment targets.
# The default schema, catalog, etc. for dbt are defined in dbt_profiles/profiles.yml
targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-ea4bb8e5-6935.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-ea4bb8e5-6935.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/florian.fr@protonmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/florian.fr@protonmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: florian.fr@protonmail.com
        level: CAN_MANAGE
