
# This file defines dbt profiles for deployed dbt jobs.
databricks_dbt_f1:
  target: dev # default target
  outputs:

    # Doing local development with the dbt CLI?
    # Then you should create your own profile in your .dbt/profiles.yml using 'dbt init'
    # (See README.md)

    # The default target when deployed with the Databricks CLI
    # N.B. when you use dbt from the command line, it uses the profile from .dbt/profiles.yml
    dev:
      type: databricks
      method: http
      catalog: lake_dev
      schema: default

      http_path: /sql/1.0/warehouses/c31436beb8eee93c

      # The workspace host / token are provided by Databricks
      # see databricks.yml for the workspace host used for 'dev'
      host: "{{ env_var('DBT_HOST') }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"

    # CI target (GitHub Actions): authenticates as the CI service principal
    # via OAuth M2M. Only used to execute the singular macro tests
    # (test_type:singular), which are pure SELECTs over literals -- no
    # tables, schemas, or other entities are created. Catalog/schema are
    # just the session defaults.
    ci:
      type: databricks
      method: http
      catalog: lake_dev
      schema: default

      http_path: /sql/1.0/warehouses/c31436beb8eee93c

      host: "{{ env_var('DBT_HOST') }}"
      auth_type: oauth
      client_id: "{{ env_var('DBT_CLIENT_ID', '') }}"
      client_secret: "{{ env_var('DBT_CLIENT_SECRET', '') }}"

    # The production target: authenticates as a service principal via
    # OAuth M2M. The prod job/workflow providing DBT_CLIENT_ID and
    # DBT_CLIENT_SECRET does not exist yet.
    prod:
      type: databricks
      method: http
      catalog: lake_prod
      schema: default

      http_path: /sql/1.0/warehouses/c31436beb8eee93c

      # see databricks.yml for the workspace host used for 'prod'
      host: "{{ env_var('DBT_HOST') }}"
      auth_type: oauth
      client_id: "{{ env_var('DBT_CLIENT_ID', '') }}"
      client_secret: "{{ env_var('DBT_CLIENT_SECRET', '') }}"
