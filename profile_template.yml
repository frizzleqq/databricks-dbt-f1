# This file defines prompts with defaults for dbt initializaton.
# It is used when the `dbt init` command is invoked.
#
fixed:
  type: databricks
prompts:
  host:
    default: dbc-ea4bb8e5-6935.cloud.databricks.com
  token:
    hint: 'personal access token to use, dapiXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
    hide_input: true
  http_path:
    hint: 'HTTP path of SQL warehouse to use'
    default: /sql/1.0/warehouses/c31436beb8eee93c
  catalog:
    hint: 'initial catalog'
    default: lake_dev
  schema:
    hint: 'personal schema where dbt will build objects during development, example: florian_fr'
  threads:
    hint: 'threads to use during development, 1 or more'
    type: 'int'
    default: 4
